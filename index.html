<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFF159">
<title>CAD DINO | Painel diário da operação</title>
<style>
:root{color-scheme:light;--bg:#eef2f6;--white:#fff;--ink:#101e40;--muted:#65738a;--yellow:#fff159;--blue:#1558cc;--blue2:#3483fa;--line:#b9c4d0;--green:#00a650;--red:#cc0000;--gold:#d6af00;--silver:#8d969f;--bronze:#ad7047}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:linear-gradient(#eef2f6,#f7f9fc);color:var(--ink);font-family:"Proxima Nova",Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
body{height:100vh;display:grid;grid-template-rows:auto auto auto minmax(0,1fr);gap:1.05vh;padding:0 1.35vw 1.2vh}
header{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;justify-content:space-between;min-height:clamp(104px,14vh,166px);margin:0 -1.35vw;padding:0 1.6vw;background:#173f2d;border-bottom:4px solid #ffe65b;box-shadow:0 5px 16px #101e4033}
header:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(11,36,24,.42) 0%,rgba(11,36,24,.24) 24%,rgba(11,36,24,.05) 48%,rgba(11,36,24,.08) 72%,rgba(11,36,24,.36) 100%);pointer-events:none}header:after{content:"";position:absolute;z-index:3;right:0;bottom:0;width:34%;height:2px;background:linear-gradient(90deg,transparent,#fff159,transparent);pointer-events:none}
.header-art{position:absolute;z-index:0;inset:0;width:100%;height:100%;object-fit:cover;object-position:52% 0%;opacity:1;pointer-events:none;user-select:none}
.brand-lockup{display:flex;align-items:center;min-width:0;position:relative;z-index:2;padding:0;border:0;background:transparent;box-shadow:none}.brand-logo{display:block;width:clamp(104px,10vw,148px);height:clamp(104px,10vw,148px);object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 3px 8px #000b)}
.dino-badge{width:clamp(38px,3vw,54px);height:clamp(38px,3vw,54px);display:grid;place-items:center;flex:0 0 auto;border:2px solid #ffe65b;border-radius:50%;background:radial-gradient(circle at 35% 28%,#252525,#050505 72%);box-shadow:0 2px 8px #000a}
.dino-badge svg{width:90%;height:90%;filter:drop-shadow(0 1px 1px #102e1e40)}
.brand{font-family:Georgia,"Times New Roman",serif;font-size:clamp(25px,2vw,42px);font-weight:900;line-height:1;letter-spacing:.075em;color:#fff;text-shadow:0 1px 1px #000;-webkit-text-stroke:1px #d9232e}
.brand span{color:#fff;text-shadow:0 1px 1px #000;-webkit-text-stroke:1px #d9232e}
.timestamp{position:relative;z-index:2;flex:0 0 auto;max-width:48vw;padding:.45vh .82vw;border:1px solid #fff159;border-radius:999px;background:#fffdf0;color:#183c2b;font-size:clamp(11px,.85vw,18px);line-height:1.2;font-weight:850;text-align:right;white-space:nowrap;box-shadow:0 3px 8px #0d261a38}
.slide-head{display:flex;align-items:center;justify-content:flex-end;min-height:4.5vh;padding:0 .2vw}
.slide-nav{display:flex;align-items:center;gap:clamp(8px,.75vw,14px)}
.nav-button{width:clamp(34px,2.8vw,52px);height:clamp(34px,2.8vw,52px);display:grid;place-items:center;border:0;border-radius:9px;background:#191919;color:#fff;font:900 clamp(20px,1.6vw,30px)/1 Arial,sans-serif;cursor:pointer;box-shadow:0 3px 8px #101e402e;transition:transform .18s,background .18s}
.nav-button:hover{background:var(--blue2);transform:translateY(-2px)}
.slide-count{min-width:5.3em;text-align:center;color:var(--ink);font-size:clamp(13px,.94vw,19px);font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.slide-dots{display:flex;align-items:center;gap:clamp(5px,.42vw,8px);max-width:25vw;overflow:hidden}
.slide-dot{width:clamp(7px,.45vw,10px);height:clamp(7px,.45vw,10px);padding:0;border:0;border-radius:99px;background:#b8c3d1;cursor:pointer;transition:width .2s,background .2s,transform .2s}
.slide-dot:hover{background:var(--blue2);transform:scale(1.18)}
.slide-dot[aria-current=true]{width:clamp(20px,1.35vw,32px);background:#191919;box-shadow:0 0 0 2px #fff159a6}
.nav-button:focus-visible,.slide-dot:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(9px,.9vw,17px);min-height:12vh}
.metric{position:relative;overflow:hidden;min-width:0;display:flex;flex-direction:column;justify-content:space-between;padding:.9vh .9vw;background:linear-gradient(145deg,#fff,#fbfcff);border:1px solid #b7c2cf;border-top:3px solid var(--yellow);border-radius:11px;box-shadow:0 3px 8px #101e4024}
.metric:after{content:"";position:absolute;right:-28px;bottom:-50px;width:92px;height:92px;border:1px solid #fff15966;border-radius:50%;box-shadow:0 0 0 10px #fff1591f,0 0 0 20px #fff15912;pointer-events:none}
.metric-head{display:flex;align-items:baseline;justify-content:space-between;gap:.6em}
.metric-name{font-size:clamp(19px,1.55vw,31px);font-weight:950;letter-spacing:.035em;color:var(--ink)}
.goal{display:inline-flex;align-items:center;align-self:flex-start;padding:.26em .72em;border:1px solid #e2e3e5;border-radius:999px;background:#f3f4f6;font-size:clamp(10px,.72vw,14px);font-weight:850;color:#4b5563;white-space:nowrap}
.metric-value{font-size:clamp(23px,2vw,41px);font-weight:950;line-height:1.05;white-space:nowrap;color:var(--blue);font-variant-numeric:tabular-nums}
.metric.status-good,.metric.status-bad{background:linear-gradient(145deg,#fff,#fffdf2)}
.metric.status-good .metric-value{color:var(--green)}
.metric.status-bad .metric-value{color:var(--red)}
.metric.missing{background:#fff}
.metric.missing .metric-value{font-size:clamp(17px,1.35vw,27px);color:var(--muted)}
.metric.units-total{border-top-color:#28734c;background:linear-gradient(145deg,#f8fff5,#eef8e9)}
.metric.units-total:after{border-color:#28734c3d;box-shadow:0 0 0 10px #28734c12,0 0 0 20px #28734c08}
.metric.units-total .metric-name{color:#245b3b}
.metric.units-total .metric-value{color:#28734c;font-size:clamp(25px,2.05vw,42px)}
.count-dino{font-size:clamp(20px,1.45vw,28px);line-height:1}
.metric-meta{display:flex;align-items:center;justify-content:space-between;gap:.45vw;min-width:0}
.achievement{display:inline-flex;align-items:center;justify-content:center;max-width:62%;padding:.3em .7em;border-radius:999px;font-size:clamp(9px,.7vw,13px);font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.achievement.met{background:#a8e9bd;color:#146534}
.achievement.near{background:#ffd39a;color:#744100}
.achievement.low{background:#f6b7b7;color:#7e2020}
.metric.icqa .goal{align-self:auto;padding:0;border:0;background:transparent;color:var(--muted);font-size:clamp(11px,.78vw,15px)}
.icqa-detail{font-size:clamp(11px,.82vw,16px);line-height:1.3;color:#53627a;font-weight:700}
.carousel{position:relative;min-height:0;overflow:hidden;background:transparent}
.content{position:relative;min-height:0;height:100%;display:grid;grid-template-columns:minmax(140px,.42fr) minmax(380px,1.8fr) minmax(300px,1.2fr);gap:clamp(10px,.9vw,18px);align-items:stretch}
.process-identity{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2vh,24px);min-width:0;min-height:0;padding:1vw;border:1px solid #b7c7dc;border-top:5px solid var(--yellow);border-radius:10px;background:linear-gradient(#fffdf2,#fff8cf);box-shadow:0 3px 8px #101e401f}
.process-identity:before{content:"";position:absolute;inset:9px;border:1px solid #bf930033;border-radius:7px;pointer-events:none}
.process-identity:after{content:"";position:absolute;right:-34%;bottom:-14%;width:95%;aspect-ratio:1;border:1px solid #bf930033;border-radius:50%;box-shadow:0 0 0 14px #fff15914,0 0 0 28px #fff1590d;pointer-events:none}
.slide-title{position:relative;z-index:1;max-width:100%;color:#191919;font-size:clamp(26px,2.2vw,48px);font-weight:950;line-height:1.04;letter-spacing:.025em;text-align:center;text-transform:uppercase;overflow-wrap:anywhere}
.process-symbol{position:relative;z-index:1;width:clamp(48px,4.2vw,84px);height:auto;color:#191919;filter:drop-shadow(#19191920 0 4px 3px)}
.process-symbol svg{display:block;width:100%;height:auto;overflow:visible}
.podium-area,.following{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);background:linear-gradient(160deg,#fff,#f9fbfe);border:1px solid #aeb9c8;border-radius:11px;box-shadow:0 3px 8px #101e401f;overflow:hidden}
.podium-area{background:linear-gradient(#f5f5f5,#e9e9e9)}
.section-label{display:flex;align-items:center;justify-content:center;min-height:5.7vh;margin:0;padding:.5vh .7vw;background:linear-gradient(90deg,#f5f8fc,#e6ebf1,#f5f8fc);border-bottom:1px solid #d5dde7;color:var(--ink);font-size:clamp(15px,1.25vw,24px);font-weight:950;letter-spacing:.045em;text-align:center}
.following .section-label{border-bottom:3px solid var(--yellow);background:linear-gradient(90deg,#fffdf0,#f3f6fb)}
.podium{height:100%;min-height:0;padding:1vh .7vw .75vh;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:clamp(8px,.8vw,15px)}
.podium-item{position:relative;isolation:isolate;overflow:hidden;min-width:0;min-height:0;height:73%;padding:1vh .55vw;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:.65vh;border:2px solid #b7c5d4;border-radius:11px;background:linear-gradient(160deg,#fff,#f7faff);text-align:center;box-shadow:0 3px 9px #101e4026}
.podium-item>*{position:relative;z-index:1}
.podium-item.rank-1{order:2;height:100%;padding-top:2.1vh;border:3px solid #e3c900;background:linear-gradient(155deg,#fff,#fffef2 55%,#fff8ce);box-shadow:0 5px 15px #c2a40033}
.podium-item.rank-2{order:1;height:72%;border-color:#aeb5bd;background:linear-gradient(155deg,#fff,#f1f2f3)}
.podium-item.rank-3{order:3;height:68%;border-color:#b98259;background:linear-gradient(155deg,#fff,#f8f0e9)}
.rank-block{display:flex;flex-direction:column;align-items:center;gap:.25vh}
.podium-rank{font-size:clamp(34px,2.65vw,55px);font-weight:950;line-height:1;color:#2869ca;text-align:center}
.podium-item.rank-1 .rank-block{position:relative}
.podium-item.rank-1 .rank-block:before{content:"♛";position:absolute;left:50%;top:-.78em;transform:translateX(-50%);color:#b08b00;font-size:clamp(25px,2vw,42px);line-height:1;text-shadow:0 2px #fff5b8,0 3px 5px #5e470033}
.podium-item.rank-1 .podium-rank{font-size:clamp(41px,3.15vw,65px);color:#a47b00}
.podium-item.rank-2 .podium-rank{color:#737d87}
.podium-item.rank-3 .podium-rank{color:#985d35}
.medal{display:block;width:clamp(43px,3.45vw,72px);height:auto;filter:drop-shadow(#101e4033 0 3px 5px)}
.medal-ribbon{stroke-width:2;stroke-linejoin:round}
.medal-gold .medal-ribbon{fill:#c28a00;stroke:#946700}
.medal-gold .medal-disc{fill:#f4c542;stroke:#b17b00;stroke-width:5}
.medal-gold .medal-inner{fill:#fff2b8;stroke:#ffe27a;stroke-width:3}
.medal-gold .medal-star{fill:#b17b00}
.medal-silver .medal-ribbon{fill:#aeb6bf;stroke:#7f8993}
.medal-silver .medal-disc{fill:#d8dde2;stroke:#8d969f;stroke-width:5}
.medal-silver .medal-inner{fill:#f8f9fa;stroke:#c5cbd1;stroke-width:3}
.medal-silver .medal-star{fill:#7f8993}
.medal-bronze .medal-ribbon{fill:#ae7147;stroke:#80502f}
.medal-bronze .medal-disc{fill:#d69a6d;stroke:#985d35;stroke-width:5}
.medal-bronze .medal-inner{fill:#f7dfcd;stroke:#e6b995;stroke-width:3}
.medal-bronze .medal-star{fill:#985d35}
.rep-label{min-width:0;max-width:100%;font-size:clamp(17px,1.45vw,23px);font-weight:850;line-height:1.12;color:var(--ink);text-align:center;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow-wrap:anywhere}
.rep-value{display:block;min-width:0;margin:0;font-size:clamp(19px,1.45vw,29px);font-weight:950;line-height:1.05;white-space:nowrap;text-align:center;font-variant-numeric:tabular-nums;color:var(--blue)}
.podium-item.rank-1 .rep-value{color:#a47b00}
.podium-item.rank-2 .rep-value{color:#737d87}
.podium-item.rank-3 .rep-value{color:#985d35}.podium-item .rep-value.status-neutral,.following .rep-value.status-neutral{color:var(--blue)!important}.podium-item .rep-value.status-good,.following .rep-value.status-good{color:var(--green)!important}.podium-item .rep-value.status-bad,.following .rep-value.status-bad{color:var(--red)!important}
.content.podium-only{grid-template-columns:minmax(120px,.42fr) minmax(0,1.7fr) minmax(0,.4fr)}
.content.podium-only .following{display:none}
.content.podium-only .podium-area{grid-column:2/4}
.content.podium-only .podium[data-count="2"]{grid-template-columns:repeat(2,minmax(0,1fr));width:min(100%,850px);margin-inline:auto}
.content.podium-only .podium[data-count="1"]{grid-template-columns:minmax(0,1fr);width:min(100%,550px);margin-inline:auto}
.content.podium-only .podium-item{min-height:0}
.content.podium-only .podium-item.rank-1{height:100%}
.content.podium-only .podium-item.rank-2{height:72%}
.empty-state{grid-column:1/-1;align-self:center;justify-self:center;width:min(80%,620px);padding:24px 18px;border:1px solid #b9c4d0;border-radius:11px;background:#fff;color:var(--muted);font-weight:850;text-align:center}
.following-list{height:100%;min-height:0;padding:0 .35vw;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(var(--remaining-count,7),minmax(0,1fr));gap:0}
.follow-row{position:relative;isolation:isolate;overflow:hidden;min-width:0;min-height:0;display:grid;grid-template-columns:38px minmax(0,1.7fr) minmax(48px,.55fr) minmax(82px,auto);align-items:center;gap:clamp(5px,.45vw,9px);padding:.35vh .55vw;background:#ffffffcc;border-bottom:1px solid #e0e6ed}
.follow-row:before{content:"";position:absolute;z-index:0;inset:0 auto 0 0;width:3px;background:var(--yellow)}
.follow-row>*{position:relative;z-index:1}
.position{font-size:clamp(12px,.88vw,17px);font-weight:950;color:#53627a;font-variant-numeric:tabular-nums;text-align:center}
.follow-row .rep-label{font-size:clamp(15px,.96vw,19px);text-align:left;line-height:1.1;font-weight:850}
.follow-track{height:clamp(8px,.68vh,11px);min-width:0;background:#e3e5e8;border-radius:99px;overflow:hidden}
.follow-track span{position:relative;display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue2),var(--blue))}
.follow-track span:after{content:"";position:absolute;right:0;top:0;width:4px;height:100%;background:var(--yellow);box-shadow:0 0 4px #fff159cc}
.follow-row .rep-value{font-size:clamp(14px,1vw,20px);text-align:right;color:#333}
.following[hidden]{display:none!important}
@media(max-height:760px) and (min-width:1001px){body{gap:.75vh;padding-bottom:.8vh}.summary{min-height:12.5vh}.section-label{min-height:5vh}.podium-item{gap:.4vh;padding:.6vh .45vw}.podium-rank{font-size:34px}.podium-item.rank-1 .podium-rank{font-size:42px}.medal{width:clamp(38px,3vw,58px)}.follow-row{padding:.2vh .4vw}.follow-row .rep-label{font-size:clamp(14px,.9vw,17px)}}

 }

 if(item.label==="ICQA"){
  const value=item.value===null?"—":item.value;
  return '<article class="metric icqa '+level+'"><div class="metric-head"><div class="metric-name">ICQA</div><div class="goal">META '+item.target+' u/h</div></div><div class="metric-value">'+value+' u/h</div><div class="icqa-detail">'+item.status+'</div></article>';
 }
 const achievement=item.state==="above"?"met":item.state==="below"?"near":"low";
 return '<article class="metric '+level+'"><div class="metric-head"><div class="metric-name">'+item.label+'</div></div><div class="metric-value">'+item.value+' u/h</div><div class="metric-meta"><div class="goal">Meta: '+item.target+' u/h</div><div class="achievement '+achievement+'">'+item.status+'</div></div></article>';
}).join("");
let current=0;
let timer=null;
const dotsRoot=document.getElementById("slideDots");
dotsRoot.innerHTML=visibleSlides.map(function(s,i){return '<button class="slide-dot" type="button" aria-label="Mostrar '+s.label+'" data-slide="'+i+'"></button>';}).join("");
function medalSvg(index){
 const classes=["gold","silver","bronze"];
 const labels=["ouro","prata","bronze"];
 return '<svg class="medal medal-'+classes[index]+'" viewBox="0 0 100 120" role="img" aria-label="Medalha de '+labels[index]+'"><path class="medal-ribbon" d="M25 4h23l-3 46-15-11-12 10zM52 4h23l7 45-16-10-13 11z"></path><circle class="medal-disc" cx="50" cy="78" r="29"></circle><circle class="medal-inner" cx="50" cy="78" r="21"></circle><path class="medal-star" d="m50 62 5 10 11 1.6-8 7.8 1.9 11L50 87.2l-9.9 5.2 1.9-11-8-7.8 11-1.6z"></path></svg>';
}
function slideValue(person,slide){
 return slide.metric==="units"?Number(person.units)||0:Number(person.rate)||0;
}
function slideUnit(slide){
 return slide.metric==="units"?" un.":" u/h";
}
function slideFormat(value,slide){
 return slide.metric==="units"?unitsFormat.format(value):numberFormat.format(value);
}
function personRateClass(person,slide){
 if(slide.metric==="units")return Number(person.units)>Number(slide.targetUnits??4)?"status-good":"status-bad";
 if(person.target===null||person.target===undefined)return "status-neutral";
 return person.rate>=Number(person.target)?"status-good":"status-bad";
}
function personRateTitle(person,slide){
 if(slide.metric==="units")return "Meta: mais de "+numberFormat.format(slide.targetUnits??4)+" un.";
 return person.target===null||person.target===undefined?"Meta não disponível":"Meta: "+numberFormat.format(person.target)+" u/h";
}
function podiumCard(person,index,slide){
 const rank=index+1;
 const rankText=["1º","2º","3º"];
 const value=slideValue(person,slide);
 return '<article class="podium-item rank-'+rank+'"><div class="rank-block"><div class="podium-rank">'+rankText[index]+'</div>'+medalSvg(index)+'</div><div class="rep-label" title="'+person.name+'">'+person.name+'</div><div class="rep-value '+personRateClass(person,slide)+'" title="'+personRateTitle(person,slide)+'">'+slideFormat(value,slide)+slideUnit(slide)+'</div></article>';
}
function renderSlide(index){
 current=(index+visibleSlides.length)%visibleSlides.length;
 const slide=visibleSlides[current];
 document.getElementById("processIcon").innerHTML=processIcons[slide.label]||"";
 document.getElementById("processTitle").textContent=slide.label;
 document.getElementById("slideCount").textContent=String(current+1).padStart(2,"0")+" / "+String(visibleSlides.length).padStart(2,"0");
 dotsRoot.querySelectorAll(".slide-dot").forEach(function(dot,i){dot.setAttribute("aria-current",i===current?"true":"false");});
 const top=slide.rows.slice(0,3);
 const remaining=slide.rows.slice(3,10);
 const content=document.getElementById("content");
 const podium=document.getElementById("podium");
 const nextSection=document.getElementById("nextSection");
 const nextList=document.getElementById("nextList");
 content.classList.toggle("podium-only",remaining.length===0);
 content.classList.toggle("short-list",remaining.length>0&&remaining.length<7);
 podium.dataset.count=String(top.length);
 if(!slide.rows.length){
  podium.innerHTML='<div class="empty-state">Sem dados de hoje</div>';
  nextSection.hidden=true;
  nextList.innerHTML="";
 }else{
  podium.innerHTML=top.map(function(person,index){return podiumCard(person,index,slide);}).join("");
  nextSection.hidden=remaining.length===0;
  const maxValue=Math.max.apply(null,slide.rows.map(function(person){return slideValue(person,slide);}));
  nextList.style.setProperty("--remaining-count",String(Math.max(1,remaining.length)));
  nextList.innerHTML=remaining.map(function(person,i){
   const value=slideValue(person,slide);
   const width=maxValue>0?Math.max(0,Math.min(100,value/maxValue*100)):0;
   return '<div class="follow-row"><span class="position">'+String(i+4).padStart(2,"0")+'</span><span class="rep-label" title="'+person.name+'">'+person.name+'</span><div class="follow-track" aria-hidden="true"><span style="width:'+width.toFixed(1)+'%"></span></div><span class="rep-value '+personRateClass(person,slide)+'" title="'+personRateTitle(person,slide)+'">'+slideFormat(value,slide)+slideUnit(slide)+'</span></div>';
  }).join("");
 }
}
function startRotation(){
 if(timer)window.clearInterval(timer);
 timer=window.setInterval(function(){renderSlide(current+1);},5000);
}
document.getElementById("prevSlide").addEventListener("click",function(){renderSlide(current-1);startRotation();});
document.getElementById("nextSlide").addEventListener("click",function(){renderSlide(current+1);startRotation();});
dotsRoot.addEventListener("click",function(event){
 const button=event.target.closest("button[data-slide]");
 if(!button)return;
 renderSlide(Number(button.dataset.slide));startRotation();
});
document.addEventListener("visibilitychange",function(){if(document.hidden){if(timer)window.clearInterval(timer);timer=null;}else{startRotation();}});
renderSlide(0);startRotation();
</script>
</body>
</html>
